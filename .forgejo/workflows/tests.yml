name: run tests 

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: codeberg-small

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: https://github.com/astral-sh/setup-uv@v5

      - name: Sync development environment
        run: uv sync

      - name: Run tests
        run: uv run pytest
