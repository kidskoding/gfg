[project]
name = "gfg"
version = "0.1.0"
description = "gfg data structures and algorithms problems for coding interviews"
readme = "README.md"
authors = [
    { name = "Anirudh Konidala", email = "anirudhkonidala@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
